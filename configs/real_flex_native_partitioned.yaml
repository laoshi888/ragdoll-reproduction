# Native Milvus Standalone partition experiment under a real cgroup RAM cap.
run:
  name: opt13b_triviaqa_native_partition_memory
  generator_backend: flexllmgen
  seed: 7
  top_k: 3
  max_new_tokens: 16
  requests_per_phase: 16
  arrival_rates_per_minute: [240]

models:
  generator: facebook/opt-1.3b
  embedder: sentence-transformers/all-MiniLM-L6-v2

flexllmgen:
  placement_profile: configs/flexllmgen_opt13b_profile.json
  max_gpu_memory_gib: 1.8
  weights_path: /root/opt_weights
  offload_dir: /root/autodl-tmp/ragdoll/data/flexllmgen_offload
  prompt_length: 128
  gpu_batch_size: 2
  num_gpu_batches: 1
  overlap: true
  pin_weight: true
  warmup: true

partition_source:
  uri: /root/autodl-tmp/ragdoll/data/ragdoll_pressure_source.db
  collection: ragdoll_pressure_source

native_corpus:
  # Repeats existing vectors within their assigned partition.  This creates
  # storage pressure without downloading or embedding another large dataset.
  rows_per_partition: 32768
  index_nlist: 1024

milvus:
  mode: native_partitions
  uri: http://127.0.0.1:19530
  collection: ragdoll_native_pressure
  partition_prefix: ragdoll_native
  partition_count: 32
  resident_partitions: 4
  search_params:
    metric_type: COSINE
    params:
      nprobe: 32

memory:
  host_budget_gib: 8.0
  llm_host_reserve_gib: 4.0
  milvus_container: ragdoll-milvus-standalone
  milvus_container_limit_gib: 4.0

scheduler:
  retrieval_batch_candidates: [1, 2]
  generation_batch_candidates: [1, 2]
  static_batch_size: 2
  profiling_samples_per_batch: 3
  profiling_warmup_batches: 1
  partition_residency_candidates: [2, 4, 8, 16, 32]
  partition_residency_profile_repeats: 3
  partition_residency_selection_metric: median_latency_seconds

artifacts:
  workload_questions: /root/autodl-tmp/ragdoll/data/workload_pressure_questions.jsonl
  profiles: /root/autodl-tmp/ragdoll/experiments/profile_flex_burst.json
  result: /root/autodl-tmp/ragdoll/experiments/native_partition_result.json
  native_corpus_marker: /root/autodl-tmp/ragdoll/data/ragdoll_native_pressure.complete.json
